[package]
name = "rusty_graph"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Ultra-fast, in-memory labeled property graph database with Cypher query execution, vector search, and multi-language SDKs"
repository = "https://github.com/maheshwarLigade/rustygraph"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = { version = "1.13", features = ["serde"] }
thiserror = "2.0"
tiny_http = "0.12.0"

[[bin]]
name = "rustygraph-server"
path = "src/bin/server.rs"

[[bin]]
name = "rustygraph-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "rustygraph-mcp"
path = "src/bin/mcp.rs"
